{% extends "base.html" %}
{% block title %}Sign in | Hookrelay{% endblock %}
{% block nav %}{% endblock %}
{% block content %}
<h1>Sign in</h1>
<p class="muted">Use an API key created with <code>webhookd bootstrap</code>.</p>

{% if let Some(message) = error %}
<div class="alert error">{{ message }}</div>
{% endif %}

<form method="post" action="/login">
  <div class="field">
    <label for="api_key">API key</label>
    <input id="api_key" name="api_key" type="password" required autocomplete="off" placeholder="hr_live_...">
  </div>
  <button class="primary" type="submit">Sign in</button>
</form>
{% endblock %}
