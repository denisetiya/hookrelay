<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hookrelay{% endblock %}</title>
  <style>
    :root {
      --bg: #ffffff;
      --fg: #14181f;
      --muted: #5b6472;
      --line: #e2e6ec;
      --accent: #0f766e;
      --danger: #b42318;
      --ok: #166534;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: var(--fg);
      background: var(--bg);
      line-height: 1.5;
    }
    a { color: var(--accent); }
    header {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--line);
    }
    header nav { display: flex; flex-wrap: wrap; gap: 1rem; align-items: center; }
    header form { margin: 0; }
    main { padding: 1.25rem; max-width: 1100px; margin: 0 auto; }
    h1 { font-size: 1.35rem; margin: 0 0 1rem; }
    h2 { font-size: 1.05rem; margin: 1.5rem 0 0.75rem; }
    p { margin: 0 0 0.75rem; }
    .muted { color: var(--muted); }
    .grid { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
    .card { border: 1px solid var(--line); border-radius: 8px; padding: 0.9rem; }
    .card strong { display: block; font-size: 1.5rem; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { text-align: left; padding: 0.55rem 0.5rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; }
    .badge { display: inline-block; padding: 0.1rem 0.45rem; border-radius: 4px; font-size: 0.8rem; border: 1px solid var(--line); }
    .badge.succeeded { color: var(--ok); border-color: #bbf7d0; background: #f0fdf4; }
    .badge.dead { color: var(--danger); border-color: #fecaca; background: #fef2f2; }
    .badge.retrying, .badge.pending { color: #92400e; border-color: #fde68a; background: #fffbeb; }
    .badge.in_flight { color: #1e40af; border-color: #bfdbfe; background: #eff6ff; }
    button, .button {
      display: inline-block;
      min-height: 44px;
      padding: 0.5rem 0.9rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--fg);
      font: inherit;
      cursor: pointer;
      text-decoration: none;
    }
    button:hover, .button:hover { border-color: var(--accent); }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    form.inline { display: inline; }
    .field { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.75rem; max-width: 420px; }
    input, select { min-height: 44px; padding: 0.4rem 0.55rem; border: 1px solid var(--line); border-radius: 6px; font: inherit; }
    .alert { border: 1px solid #fde68a; background: #fffbeb; padding: 0.75rem; border-radius: 6px; margin-bottom: 1rem; }
    .error { border-color: #fecaca; background: #fef2f2; color: var(--danger); }
    pre { background: #f8fafc; border: 1px solid var(--line); border-radius: 6px; padding: 0.75rem; overflow-x: auto; font-size: 0.85rem; }
    @media (max-width: 640px) {
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      tr { border: 1px solid var(--line); border-radius: 8px; margin-bottom: 0.75rem; padding: 0.35rem; }
      td { border: none; padding: 0.3rem 0.5rem; }
      td[data-label]::before { content: attr(data-label) ": "; color: var(--muted); }
      main { padding: 1rem; }
    }
  </style>
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <header>
    <a href="/" style="font-weight:700; text-decoration:none; color:inherit;">Hookrelay</a>
    {% block nav %}
    <nav>
      <a href="/">Overview</a>
      <a href="/endpoints">Endpoints</a>
      <a href="/events">Events</a>
      <a href="/deliveries">Deliveries</a>
      <a href="/dead">Dead letters</a>
      <form method="post" action="/logout"><button type="submit">Sign out</button></form>
    </nav>
    {% endblock %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
