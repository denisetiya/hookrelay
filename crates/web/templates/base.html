<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hookrelay{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230f5c55'/%3E%3Cpath d='M9 22V10h3v4h8v-4h3v12h-3v-5h-8v5z' fill='%23faf9f7'/%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #faf9f7;
      --surface: #ffffff;
      --ink: #191b1c;
      --muted: #5f6368;
      --line: #e3dfd7;
      --line-strong: #cfc9be;
      --accent: #0f5c55;
      --accent-ink: #ffffff;
      --ok: #1f6b45;
      --warn: #8a4b00;
      --danger: #a3231b;
      --info: #25508f;
      --radius: 6px;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--ink);
      background: var(--bg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.55;
    }
    a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    a:hover { text-decoration: underline; }
    .skip {
      position: absolute;
      left: -9999px;
      top: 0;
      background: var(--surface);
      padding: 0.75rem 1rem;
      border: 1px solid var(--line-strong);
      z-index: 10;
    }
    .skip:focus { left: 1rem; top: 1rem; }
    .masthead { border-bottom: 1px solid var(--line); background: var(--surface); }
    .masthead-inner {
      max-width: 1180px;
      margin: 0 auto;
      padding: 0.9rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      justify-content: space-between;
      gap: 0.75rem 1.5rem;
    }
    .wordmark {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 1.35rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      color: var(--ink);
      text-decoration: none;
    }
    .wordmark:hover { text-decoration: none; color: var(--accent); }
    .nav { display: flex; flex-wrap: wrap; align-items: center; gap: 0.35rem 1.1rem; }
    .nav a, .nav .link-button {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--muted);
      font-size: 0.9rem;
      text-decoration: none;
      padding: 0.25rem 0.1rem;
    }
    .nav a:hover, .nav .link-button:hover { color: var(--ink); text-decoration: none; }
    .nav a[aria-current="page"] {
      color: var(--ink);
      box-shadow: inset 0 -2px 0 var(--accent);
    }
    main { width: 100%; flex: 1 0 auto; max-width: 1180px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
    h1, h2 {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin: 0;
    }
    h1 { font-size: clamp(1.6rem, 3vw, 2.1rem); line-height: 1.15; }
    h2 { font-size: 1.15rem; margin: 2rem 0 0.75rem; }
    p { margin: 0 0 0.75rem; }
    .eyebrow {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--muted);
      margin: 0 0 0.35rem;
    }
    .lede { color: var(--muted); max-width: 60ch; }
    .muted { color: var(--muted); }
    .mono, code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    code { font-size: 0.88em; }
    .page-head {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .page-head p { margin: 0.35rem 0 0; }
    .attention {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      gap: 1.5rem;
      align-items: end;
      padding: 1.5rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }
    .attention .count {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: clamp(2.6rem, 7vw, 4rem);
      line-height: 1;
      letter-spacing: -0.03em;
      margin: 0.25rem 0 0.5rem;
    }
    .attention .count small {
      font-family: ui-sans-serif, system-ui, sans-serif;
      font-size: 0.95rem;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0;
      margin-left: 0.4rem;
    }
    .attention .support { margin: 0; color: var(--muted); }
    .attention .actions { display: flex; flex-wrap: wrap; gap: 0.6rem; justify-content: flex-end; }
    .summary { display: flex; flex-wrap: wrap; gap: 1.5rem 2.5rem; }
    .summary div { min-width: 7rem; }
    .summary .value {
      font-family: ui-serif, Georgia, "Times New Roman", serif;
      font-size: 1.6rem;
      letter-spacing: -0.01em;
      font-variant-numeric: tabular-nums;
    }
    .summary .label { color: var(--muted); font-size: 0.85rem; }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
      font-variant-numeric: tabular-nums;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
    }
    th, td { text-align: left; padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { color: var(--muted); font-weight: 600; font-size: 0.78rem; background: #f6f4ef; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr:hover { background: #fbfaf7; }
    td.url { overflow-wrap: anywhere; }
    .status { display: inline-flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    .dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; background: var(--muted); flex: none; }
    .status.succeeded .dot, .status.active .dot { background: var(--ok); }
    .status.retrying .dot, .status.pending .dot, .status.paused .dot { background: var(--warn); }
    .status.dead .dot { background: var(--danger); }
    .status.in_flight .dot { background: var(--info); }
    .status.disabled .dot { background: var(--line-strong); }
    button, .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.5rem 0.95rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      text-decoration: none;
      white-space: nowrap;
    }
    button:hover, .button:hover { border-color: var(--ink); text-decoration: none; }
    button.primary, .button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: var(--accent-ink);
    }
    button.primary:hover, .button.primary:hover { background: #0b4a44; }
    button.small { min-height: 36px; padding: 0.3rem 0.6rem; font-size: 0.82rem; }
    .link-button {
      border: 0;
      background: none;
      min-height: auto;
      padding: 0;
      color: var(--muted);
      font-size: 0.9rem;
      cursor: pointer;
    }
    .link-button:hover { color: var(--ink); }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    form.inline { display: inline; }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 0.75rem;
      padding: 1rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      margin-bottom: 1.5rem;
    }
    .field { display: flex; flex-direction: column; gap: 0.3rem; min-width: 0; }
    .field.grow { flex: 1 1 20rem; }
    .field label { font-size: 0.8rem; color: var(--muted); font-weight: 600; }
    input, select {
      min-height: 44px;
      padding: 0.45rem 0.6rem;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      font: inherit;
      font-size: 0.9rem;
    }
    .tabs { display: flex; flex-wrap: wrap; gap: 0.25rem; margin-bottom: 1rem; }
    .tabs a {
      padding: 0.45rem 0.7rem;
      border-radius: var(--radius);
      color: var(--muted);
      text-decoration: none;
      font-size: 0.88rem;
    }
    .tabs a:hover { background: #f1eee8; text-decoration: none; }
    .tabs a[aria-current="page"] { background: var(--ink); color: var(--bg); }
    .callout {
      border: 1px solid var(--line-strong);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 1rem;
      margin-bottom: 1.5rem;
    }
    .callout code { display: block; margin: 0.4rem 0; overflow-wrap: anywhere; }
    .callout.error { border-color: #e3b4ae; background: #fdf5f4; }
    .empty {
      border: 1px dashed var(--line-strong);
      border-radius: var(--radius);
      padding: 1.5rem;
      color: var(--muted);
      background: transparent;
    }
    .empty strong { color: var(--ink); display: block; margin-bottom: 0.25rem; }
    .detail-grid { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 2rem; align-items: start; }
    pre {
      margin: 0;
      padding: 0.9rem;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow-x: auto;
      font-size: 0.82rem;
      line-height: 1.5;
    }
    .meta { display: flex; flex-wrap: wrap; gap: 0.4rem 1.5rem; color: var(--muted); font-size: 0.88rem; margin: 0.5rem 0 0; }
    .auth { min-height: 60vh; display: grid; place-items: center; }
    .auth-card {
      width: min(26rem, 100%);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 2rem;
    }
    .auth-card h1 { font-size: 1.6rem; margin-bottom: 0.35rem; }
    .auth-card .field { margin: 1.25rem 0; }
    footer { border-top: 1px solid var(--line); color: var(--muted); font-size: 0.82rem; }
    footer div { max-width: 1180px; margin: 0 auto; padding: 1.25rem 1.5rem; }
    @media (max-width: 800px) {
      .attention { grid-template-columns: 1fr; align-items: start; }
      .attention .actions { justify-content: flex-start; }
      .detail-grid { grid-template-columns: 1fr; }
    }
    @media (max-width: 640px) {
      main { padding: 1.25rem 1rem 3rem; }
      .masthead-inner { padding: 0.75rem 1rem; }
      table, thead, tbody, tr, th, td { display: block; }
      thead { display: none; }
      table { border: 0; background: transparent; }
      tr {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        margin-bottom: 0.75rem;
        padding: 0.35rem;
      }
      td { border: none; padding: 0.3rem 0.5rem; }
      td[data-label]::before {
        content: attr(data-label);
        display: block;
        color: var(--muted);
        font-size: 0.72rem;
        font-weight: 600;
      }
      .toolbar { align-items: stretch; }
      .field.grow { flex-basis: 100%; }
      button.small { min-height: 44px; }
      .tabs a { display: inline-flex; align-items: center; min-height: 44px; }
    }
  </style>
  <script src="/static/htmx.min.js" defer></script>
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="masthead">
    <div class="masthead-inner">
      <a class="wordmark" href="/">Hookrelay</a>
      {% block nav %}
      <nav class="nav" aria-label="Main">
        <a href="/" {% if section == "overview" %}aria-current="page"{% endif %}>Overview</a>
        <a href="/endpoints" {% if section == "endpoints" %}aria-current="page"{% endif %}>Endpoints</a>
        <a href="/events" {% if section == "events" %}aria-current="page"{% endif %}>Events</a>
        <a href="/deliveries" {% if section == "deliveries" %}aria-current="page"{% endif %}>Deliveries</a>
        <a href="/dead" {% if section == "dead" %}aria-current="page"{% endif %}>Dead letters</a>
        <form method="post" action="/logout"><button class="link-button" type="submit">Sign out</button></form>
      </nav>
      {% endblock %}
    </div>
  </header>
  <main id="content">
    {% block content %}{% endblock %}
  </main>
  <footer>
    <div>Hookrelay. Signed delivery, retries, and an audit trail. Server rendered, no client build.</div>
  </footer>
</body>
</html>
