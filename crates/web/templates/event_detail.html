{% extends "base.html" %}
{% block title %}{{ event.event_type }} | Hookrelay{% endblock %}
{% block content %}
<p><a href="/events">&larr; All events</a></p>
<div class="page-head">
  <div>
    <h1>{{ event.event_type }}</h1>
    <p class="meta"><code>{{ event.id }}</code> <span>{{ event.created_at }}</span></p>
  </div>
</div>

<h2>Payload</h2>
<pre>{{ payload }}</pre>
{% endblock %}
